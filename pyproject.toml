[project]
name = "travel-planner"
version = "0.1.0"
description = "FastAPI travel planner test assessment"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.uv]
package = false

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
